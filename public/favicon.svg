<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Corte Real">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6D3"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8941F"/>
    </linearGradient>
  </defs>
  <circle cx="16" cy="16" r="15" fill="#0F0F0F" stroke="url(#g)" stroke-width="1.4"/>
  <circle cx="16" cy="16" r="12.5" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.5"/>
  <!-- Crown -->
  <g transform="translate(16, 7)">
    <path d="M -5 2 L -4 -1 L -2 1 L 0 -2 L 2 1 L 4 -1 L 5 2 Z" fill="url(#g)"/>
    <rect x="-5" y="2" width="10" height="1.6" fill="url(#g)"/>
    <circle cx="0" cy="-2" r="0.6" fill="#F5E6D3"/>
  </g>
  <!-- Scissors (X) -->
  <g transform="translate(16, 16)" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round" fill="none">
    <line x1="-5" y1="-5" x2="5" y2="5"/>
    <line x1="5" y1="-5" x2="-5" y2="5"/>
  </g>
  <g transform="translate(16, 16)" stroke="url(#g)" stroke-width="1.4" fill="none">
    <circle cx="-5" cy="-5" r="1.6"/>
    <circle cx="-5" cy="5" r="1.6"/>
    <circle cx="5" cy="-5" r="1.6"/>
    <circle cx="5" cy="5" r="1.6"/>
  </g>
  <!-- CR -->
  <text x="16" y="27" text-anchor="middle" font-family="Georgia, serif"
        font-size="5.5" font-weight="700" fill="url(#g)" letter-spacing="0.5">CR</text>
</svg>
